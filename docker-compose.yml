version: '3.9'

services:
  # ── Python ML Microservice ────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: adyam_ml_service
    ports:
      - "8000:8000"
    environment:
      - ML_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Node.js Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adyam_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: adyam_network
